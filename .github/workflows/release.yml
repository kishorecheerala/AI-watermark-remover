name: Publish GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor Android platform
        working-directory: mobile
        run: npx cap sync android

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > mobile/android/local.properties

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build signed APK
        working-directory: mobile/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and rename APK
        run: |
          echo "Searching for APK files..."
          find mobile/android -name '*.apk' -type f 2>/dev/null || true
          APK_PATH=$(find mobile/android/app/build/outputs -name '*.apk' -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found in build outputs!"
            find mobile/android/app/build -type f -name '*.apk' 2>/dev/null || echo "No APK files anywhere"
            exit 1
          fi
          cp "$APK_PATH" AI-Watermark-Remover-Studio.apk
          APK_SIZE=$(du -h AI-Watermark-Remover-Studio.apk | cut -f1)
          echo "✅ APK ready: $APK_PATH ($APK_SIZE)"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AI Watermark Remover Studio ${{ github.ref_name }}"
          body_path: RELEASE.md
          files: AI-Watermark-Remover-Studio.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
