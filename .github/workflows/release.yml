name: Publish GitHub Release with APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      # cap sync = cap copy + cap update: copies web assets AND regenerates
      # the capacitor-cordova-android-plugins Gradle subproject (gitignored).
      - name: Sync Capacitor Android platform
        working-directory: mobile
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x mobile/android/gradlew

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate and rename APK
        id: apk
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$APK_PATH" AI-Watermark-Remover-Studio.apk
          APK_SIZE=$(du -h AI-Watermark-Remover-Studio.apk | cut -f1)
          echo "Found APK: $APK_PATH ($APK_SIZE)"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AI Watermark Remover Studio ${{ github.ref_name }}"
          body_path: RELEASE.md
          files: AI-Watermark-Remover-Studio.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
